[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: 单元测试 (快速, 隔离)
    integration: 集成测试 (模拟依赖)
    slow: 慢速测试

# 默认选项
addopts =
    --strict-markers
    --verbose

[coverage:run]
source = app
relative_files = True
omit =
    tests/*
    */__init__.py
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
