# 数据源权威配置 (2026-07-24 固化, git tracked)
# 所有数据 fetch 必须按本表声明的源拉取, 不在表里的数据 = 未支持
# 改这个文件 = 改全项目数据源 (单一权威)
#
# ⚠️ 2026-11-06 逐条对照 tools/storage/sources/tushare.py + tools/storage/store.py
#    实际调用核实, 原表有 4 处与代码不符, 已修正:
#      ① kline_60min / Sina  —— 整条删除。代码里 0 处 Sina 调用 (60min 是 czsc/缠论
#         依赖, 缠论下线后已无消费者), 且 Sina 不在合法源白名单 (合法源只有 tushare.pro)
#      ② kline_weekly —— 周线不是拉 Tushare.weekly, 是**日线合成**
#         (store.py::_synthesize_weekly ← eastmoney.py 纯计算模块)。
#         Tushare.weekly 只在死代码 fetch_all_tushare() 里, 那函数只被自己的 __main__ 调用
#      ③ real_time —— 「实时价」来自日 K 线最新收盘 (store.py: current_price = close
#         or db['close']), 不是 daily_basic; daily_basic 只提供 PE/市值/换手率
#      ④ industry_sector —— stock_basic 只有 industry 一个字段, 「概念板块」走 THS
#    并补上 3 个实际在用但漏写的源: valuation_factor / stock_basic / ths_sector
#
# 字段:
#   primary: 主源 (必填)
#   fallback: 备源 (可选, 逗号分隔, 按顺序尝试)
#   unit: 数据单位 (渲染层用, 不影响拉取)
#   ttl: 缓存秒数 (可选)
#   note: 备注

real_time:
  primary: Tushare.daily (最新收盘价)
  fallback: Tushare.stk_factor (收盘价, K 线缺失时兜底)
  unit: 元
  note: 实时价 = 日 K 线最新收盘 (K 线是权威源, 永远不比估值快照旧)

kline_daily:
  primary: Tushare.daily
  unit: 元
  note: 日 K 线, 默认 1300 根 (见 project.yaml data.kline_days)

kline_weekly:
  primary: 日线合成 (_synthesize_weekly)
  unit: 元
  note: 周线由日线合成 (自然周, 周一开盘~周五收盘), 不额外拉 Tushare.weekly

valuation_factor:
  primary: Tushare.stk_factor
  unit: 元 / 亿元
  note: PE/PB/总市值/换手率/量比/总股本 (stk_factor parquet)

finance_quarterly:
  primary: Tushare.fina_indicator
  fallback: Tushare.income
  unit: 元/股
  note: 已审计财报指标 (EPS/ROE/营收/净利), 不含任何预测值
  # 2026-11-04: key 从 eps_finance 改为 finance_quarterly
  #   (EPS 一致预期整档已删, 这条现在只描述已审计财报指标)

stock_basic:
  primary: Tushare.stock_basic
  unit: 亿股
  note: 名称/行业/上市日期/总股本/流通股本, 落 data/history/stock_basic/

ths_sector:
  primary: Tushare.ths_index + ths_daily
  unit: 元
  note: 同花顺概念板块 K 线 (sync --ths), 落 data/history/ths/

# ❌ 禁用源 (拉取必失败, 历史踩坑)
banned:
  - push2.eastmoney.com       # WAF 拒接
  - push2his.eastmoney.com    # WAF 拒接
  - 82.push2.eastmoney.com    # WAF 拒接
  - stock.xueqiu.com          # 需 cookie
  - web.ifzq.gtimg.cn         # WAF 高频限流 (2026-07-24 实测)
  - push2delay.eastmoney.com  # rc=102 限流 (2026-07-24 实测)
  - qt.gtimg.cn               # GBK 编码, 高频限流
  - money.finance.sina.com.cn # 60min 唯一源, 缠论下线后已 0 调用 (2026-11-06 补进禁用名单)
